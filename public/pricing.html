<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>aogaprint</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Playfair+Display:wght@900&display=swap');

  :root{
    color-scheme: light only;
    --paper:#f7f4ec;
    --ink:#1f1c18;
    --ink-soft:#5a544a;
    --line:#c9c1af;
    --accent:#c1440e;
    --accent-soft:#e8dcc8;
  }
  *{box-sizing:border-box;}
  html{ background:#ffffff; color-scheme:light; }
  body{
    margin:0;
    min-height:100vh;
    background:#ffffff;
    font-family:'JetBrains Mono', monospace;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }
  .receipt{
    width:100%;
    max-width:420px;
    background:var(--paper);
    padding:28px 26px 20px;
    position:relative;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }

  h1{
    margin:0 0 2px;
  }
  .brand-lockup{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:4px;
    margin-bottom:2px;
  }
  .brand-lockup img{
    width:94px;
    height:22px;
  }
  .brand-lockup span{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:28px;
    color:var(--ink);
    line-height:1;
  }
  .sub{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:18px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:16px 0;
  }
  .field{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:13px;
  }
  .field label{ color:var(--ink-soft); flex:1; }
  .field input[type=number],
  .field input[type=text]{
    width:100px;
    padding:5px 7px;
    border:1px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:13px;
    text-align:right;
    color:var(--ink);
  }
  .field input[type=number]:focus,
  .field input[type=text]:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .unit{ font-size:11px; color:var(--ink-soft); width:34px; }

  .toggle-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    margin-bottom:10px;
  }
  .toggle-row label{ color:var(--ink-soft); }
  .switch{
    position:relative;
    width:42px; height:22px;
    background:var(--line);
    border-radius:11px;
    cursor:pointer;
    transition:background .15s;
    border:none;
    flex-shrink:0;
  }
  .switch.on{ background:var(--accent); }
  .switch::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:18px; height:18px;
    background:#fff;
    border-radius:50%;
    transition:transform .15s;
  }
  .switch.on::after{ transform:translateX(20px); }

  .paint-sub{
    padding:8px 10px;
    margin:-4px 0 12px;
    background:var(--accent-soft);
    display:none;
  }
  .paint-sub.show{ display:block; }
  .paint-sub .field{ margin-bottom:8px; font-size:12px; }
  .paint-sub .field:last-child{ margin-bottom:0; }
  .paint-sub .toggle-row.sub-toggle{ margin-bottom:8px; font-size:12px; }

  .mode-row{
    display:flex;
    gap:6px;
    margin-bottom:8px;
  }
  .mode-opt{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-family:inherit;
    font-size:11px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    background:#fff;
    padding:5px 4px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .mode-opt.active{
    border-color:var(--accent);
    color:var(--ink);
  }
  .mode-block{ display:none; }
  .mode-block.show{ display:block; }

  details#advanced{ margin-bottom:12px; }
  details#advanced summary{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    list-style:none;
    padding:4px 0;
  }
  details#advanced summary::-webkit-details-marker{ display:none; }
  details#advanced summary::before{
    content:"+ ";
    color:var(--accent);
  }
  details#advanced[open] summary::before{
    content:"− ";
  }
  details#advanced .field{ margin-top:10px; }

  .line-items{ font-size:12.5px; }
  .line{
    display:flex;
    justify-content:space-between;
    padding:3px 0;
    color:var(--ink-soft);
  }
  .line span:last-child{ color:var(--ink); }
  .line-divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:8px 0;
  }
  .thick-line{
    border:none;
    border-top:2px solid var(--ink);
    margin:16px 0;
  }

  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:14px;
    padding-top:12px;
    border-top:2px solid var(--ink);
  }
  .total-row .label{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
  }
  .total-row .value{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--accent);
  }

  .per-copy-row{
    display:none;
    justify-content:space-between;
    align-items:baseline;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .per-copy-row.show{ display:flex; }
  .per-copy-row span:last-child{
    color:var(--ink);
    font-weight:700;
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
  }

  .margin-field{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    margin-top:14px;
    color:var(--ink-soft);
  }
  .margin-field input{
    width:56px;
    padding:4px 6px;
    border:1px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:12.5px;
    text-align:right;
  }

  .barcode{
    display:block;
    width:100%;
    height:32px;
    margin-top:20px;
  }
  .footer-note{
    text-align:center;
    font-size:10px;
    color:var(--ink-soft);
    margin-top:10px;
    letter-spacing:0.5px;
  }

  .share-icon-btn{
    position:absolute;
    top:20px;
    right:20px;
    width:32px;
    height:32px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s, color .15s;
    padding:0;
  }
  .share-icon-btn:hover{ background:var(--ink); color:var(--paper); }
  .share-icon-btn:active{ transform:translateY(1px); }

  .share-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,18,15,0.85);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .share-modal.open{ display:flex; }
  .share-modal-inner{
    max-width:380px;
    width:100%;
    text-align:center;
  }
  .share-modal-inner img{
    width:100%;
    display:block;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .share-modal-hint{
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    margin-top:14px;
    letter-spacing:0.3px;
  }
  .share-modal-close{
    margin-top:14px;
    background:transparent;
    border:1px solid rgba(247,244,236,0.4);
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    padding:8px 18px;
    cursor:pointer;
  }

  .share-card{ display:none; }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const fmt = n => 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});

const originalToggle = $('originalToggle');
const originalSub = $('originalSub');
let original = false;

const postToggle = $('postToggle');
const postSub = $('postSub');
let postProcessing = false;

postToggle.addEventListener('click', () => {
  postProcessing = !postProcessing;
  postToggle.classList.toggle('on', postProcessing);
  postToggle.setAttribute('aria-pressed', postProcessing);
  postSub.classList.toggle('show', postProcessing);
  calculate();
  applyJaggedClip();
});

originalToggle.addEventListener('click', () => {
  original = !original;
  originalToggle.classList.toggle('on', original);
  originalToggle.setAttribute('aria-pressed', original);
  originalSub.classList.toggle('show', original);
  calculate();
  applyJaggedClip();
});

let modelingMode = 'time';
let reused = false;
const reuseToggle = $('reuseToggle');
reuseToggle.addEventListener('click', () => {
  reused = !reused;
  reuseToggle.classList.toggle('on', reused);
  reuseToggle.setAttribute('aria-pressed', reused);
  calculate();
  applyJaggedClip();
});

document.querySelectorAll('.mode-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    modelingMode = btn.dataset.mode;
    document.querySelectorAll('.mode-opt').forEach(b => b.classList.toggle('active', b === btn));
    $('modelingByTime').classList.toggle('show', modelingMode === 'time');
    $('modelingByComplexity').classList.toggle('show', modelingMode === 'complexity');
    calculate();
    applyJaggedClip();
  });
});

const inputs = ['pieceName','weight','time','qty','filprice','waste','power','kwh','labor','modelingTime','paintTime','originalRate','reuseRate','baseMinutes','perUnitMinutes','paintMat','margin','postTime','surfaceArea','volume'];
inputs.forEach(id => $(id).addEventListener('input', calculate));

// on-page jagged edge: same tooth/amp geometry as the shared canvas,
// applied as a clip-path so the color mapping (paper teeth, white
// gaps) is guaranteed to match rather than relying on a CSS gradient trick
function applyJaggedClip(){
  const el = document.querySelector('.receipt');
  const w = el.offsetWidth, h = el.offsetHeight;
  if (!w || !h) return;
  const tooth = 16, amp = 10;
  const count = Math.max(1, Math.round(w / tooth));
  const step = w / count;
  const pts = [`0px ${amp}px`];
  for (let i = 0; i < count; i++){
    pts.push(`${(step*i + step/2).toFixed(2)}px 0px`);
    pts.push(`${(step*(i+1)).toFixed(2)}px ${amp}px`);
  }
  pts.push(`${w}px ${h-amp}px`);
  for (let i = count - 1; i >= 0; i--){
    pts.push(`${(step*i + step/2).toFixed(2)}px ${h}px`);
    pts.push(`${(step*i).toFixed(2)}px ${h-amp}px`);
  }
  el.style.clipPath = `polygon(${pts.join(',')})`;
}
window.addEventListener('load', applyJaggedClip);
window.addEventListener('resize', applyJaggedClip);
$('advanced').addEventListener('toggle', applyJaggedClip);

// real, scannable Code128 barcode encoding "aogakid"
try {
  JsBarcode('#barcodeCanvas', 'aogakid', {
    format: 'CODE128',
    width: 2,
    height: 32,
    displayValue: false,
    margin: 0,
    lineColor: '#1f1c18',
    background: 'transparent'
  });
} catch (e) {
  console.error('Falha ao gerar código de barras', e);
}

function getCompactness(surfaceArea, volume){
  if (volume <= 0) return 0;
  const equivRadius = Math.cbrt((3 * volume) / (4 * Math.PI));
  const equivSurfaceArea = 4 * Math.PI * Math.pow(equivRadius, 2);
  return surfaceArea / equivSurfaceArea;
}

function estimateModelingMinutes(surfaceArea, volume, baseMinutes, perUnitMinutes){
  const compactness = getCompactness(surfaceArea, volume);
  if (compactness <= 0) return 0;
  return baseMinutes + perUnitMinutes * (compactness - 1);
}

function calculate(){
  const pieceName = $('pieceName').value.trim();
  const weight = parseFloat($('weight').value) || 0;
  const time = parseFloat($('time').value) || 0;
  const filprice = parseFloat($('filprice').value) || 0;
  const waste = parseFloat($('waste').value) || 0;
  const power = parseFloat($('power').value) || 0;
  const kwh = parseFloat($('kwh').value) || 0;
  const labor = parseFloat($('labor').value) || 0;
  const paintTime = parseFloat($('paintTime').value) || 0;
  const paintMat = parseFloat($('paintMat').value) || 0;
  const modelingTime = parseFloat($('modelingTime').value) || 0;
  const originalRate = parseFloat($('originalRate').value) || 0;
  const reuseRate = parseFloat($('reuseRate').value) || 0;
  const baseMinutes = parseFloat($('baseMinutes').value) || 0;
  const perUnitMinutesCfg = parseFloat($('perUnitMinutes').value) || 0;
  const postTime = parseFloat($('postTime').value) || 0;
  const margin = parseFloat($('margin').value) || 0;
  const qty = Math.max(1, Math.round(parseFloat($('qty').value) || 1));
  const surfaceArea = parseFloat($('surfaceArea').value) || 0;
  const volume = parseFloat($('volume').value) || 0;

  const weightWithWaste = weight * (1 + waste/100);
  const materialCost = (weightWithWaste / 1000) * filprice;

  const energyCost = (power/1000) * (time/60) * kwh;

  let laborMinutes = postProcessing ? postTime : 0;
  let paintCost = 0;
  if (postProcessing && paintTime > 0){
    laborMinutes += paintTime;
    paintCost = paintMat;
  }
  const laborCost = (laborMinutes/60) * labor;

  const designHours = original
    ? (modelingMode === 'time'
        ? modelingTime
        : estimateModelingMinutes(surfaceArea, volume, baseMinutes, perUnitMinutesCfg) / 60)
    : 0;
  const designRate = reused ? originalRate * (reuseRate / 100) : originalRate;
  const designCost = designHours * designRate;

  const subtotal = materialCost + energyCost + laborCost + paintCost + designCost;
  const total = subtotal * (1 + margin/100);

  const lines = [];
  lines.push(['Material (' + (weightWithWaste / qty).toFixed(1) + 'g)', materialCost / qty]);
  if (original){
    const designLabel = modelingMode === 'time'
      ? 'Modelagem (' + designHours.toFixed(2) + 'h × ' + fmt(designRate) + '/h)'
      : 'Modelagem (est. ' + (designHours * 60).toFixed(0) + ' min × ' + fmt(designRate) + '/h)';
    lines.push([designLabel, designCost / qty]);
  }
  lines.push(['Energia (' + (time / qty).toFixed(0) + ' min @ ' + power + 'W)', energyCost / qty]);
  if (laborMinutes > 0) lines.push(['Mão de obra (' + (laborMinutes / qty).toFixed(0) + ' min)', laborCost / qty]);
  if (postProcessing && paintTime > 0) lines.push(['Taxa de pintura', paintCost / qty]);
  lines.push([qty > 1 ? 'Subtotal (por cópia)' : 'Subtotal', subtotal / qty]);
  lines.push(['Lucro (' + margin.toFixed(0) + '%)', (total - subtotal) / qty]);

  $('lineItems').innerHTML = lines.map(([label, val]) =>
    (label.startsWith('Subtotal') ? '<hr class="line-divider">' : '') +
    `<div class="line"><span>${label}</span><span>${fmt(val)}</span></div>`
  ).join('');

  $('totalValue').textContent = fmt(total);
  $('perCopyRow').classList.toggle('show', qty > 1);
  if (qty > 1){
    $('qtyLabel').textContent = qty;
    $('perCopyValue').textContent = fmt(total / qty);
  }

  // stash values for the customer-facing share image (margin folded into "Mão de obra";
  // paint cost folded into "Material" since it's a manual finish, not a separate cost);
  // everything is per-copy when printing a batch
  current.pieceName = pieceName;
  current.weight = weight / qty;
  current.materialEnergy = (materialCost + energyCost + paintCost) / qty;
  current.painted = postProcessing && paintTime > 0;
  current.designCost = designCost / qty;
  current.original = original;
  current.modelingTime = designHours;
  current.production = (total - materialCost - energyCost - paintCost - designCost) / qty;
  current.total = total / qty;

  applyJaggedClip();
}

const current = {};
calculate();

function drawDashed(ctx, x1, y, x2){
  ctx.save();
  ctx.strokeStyle = '#c9c1af';
  ctx.setLineDash([4,3]);
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y);
  ctx.stroke();
  ctx.restore();
}
function drawRow(ctx, label, value, x1, x2, y){
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a544a';
  ctx.fillText(label, x1, y);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#1f1c18';
  ctx.fillText(value, x2, y);
}
function receiptPath(ctx, x, yTop, w, h, tooth, amp){
  const count = Math.round(w / tooth);
  const step = w / count;
  ctx.beginPath();
  ctx.moveTo(x, yTop + amp);
  for (let i = 0; i < count; i++){
    ctx.lineTo(x + step*i + step/2, yTop);
    ctx.lineTo(x + step*(i+1), yTop + amp);
  }
  ctx.lineTo(x + w, yTop + h - amp);
  for (let i = count - 1; i >= 0; i--){
    ctx.lineTo(x + step*i + step/2, yTop + h);
    ctx.lineTo(x + step*i, yTop + h - amp);
  }
  ctx.closePath();
}

function buildShareCanvas(){
  const W = 380;
  const amp = 10, tooth = 16;
  const scale = 3;

  // pre-compute the full layout first so we know exactly how tall the
  // canvas needs to be, and can guarantee everything sits inside the
  // solid interior (between amp and H-amp), clear of the jagged edges
  let y = amp + 38;
  const posTitle = y;
  y += 34;
  const posDash1 = y;
  y += 26;
  const posWeightLine = y;
  y += 34;
  const posDash2 = y;
  y += 28;
  const rowYs = [];
  rowYs.push(y); y += 28; // material (incl. paint cost if painted)
  if (current.original){ rowYs.push(y); y += 28; } // modelagem própria
  rowYs.push(y); y += 24; // mão de obra
  const posDash3 = y;
  y += 36;
  const posTotal = y;
  y += 32;
  const posBarcode = y;
  y += 26; // barcode height
  y += 30; // bottom breathing room before the jagged edge
  const H = y + amp;

  const canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // jagged receipt shape, filled in the receipt's paper color —
  // the notches between teeth are left unpainted, showing the transparent page
  receiptPath(ctx, 0, 0, W, H, tooth, amp);
  ctx.fillStyle = '#f7f4ec';
  ctx.fill();

  ctx.textBaseline = 'middle';
  const logoH = 22.5;
  const logoW = logoH * (812 / 190);
  ctx.font = "900 28px 'Playfair Display', serif";
  ctx.fillStyle = '#1f1c18';
  const printW = ctx.measureText('print').width;
  const gap = 4;
  let hx = W/2 - (logoW + gap + printW)/2;
  ctx.textAlign = 'left';
  ctx.drawImage($('aogalogo'), hx, posTitle - logoH/2, logoW, logoH);
  hx += logoW + gap;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('print', hx, posTitle + logoH/2);
  ctx.textAlign = 'center';

  drawDashed(ctx, 28, posDash1, W-28);

  ctx.font = "13px 'JetBrains Mono', monospace";
  ctx.fillStyle = '#5a544a';
  ctx.fillText(current.pieceName || 'Peça', W/2, posWeightLine);
  ctx.fillText(current.weight.toFixed(0) + ' gramas', W/2, posWeightLine + 17);

  drawDashed(ctx, 28, posDash2, W-28);

  ctx.font = "13.5px 'JetBrains Mono', monospace";
  let ri = 0;
  drawRow(ctx, 'Material', fmt(current.materialEnergy), 28, W-28, rowYs[ri++]);
  if (current.original) drawRow(ctx, 'Modelagem', fmt(current.designCost), 28, W-28, rowYs[ri++]);
  drawRow(ctx, 'Mão de obra', fmt(current.production), 28, W-28, rowYs[ri++]);

  drawDashed(ctx, 28, posDash3, W-28);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#1f1c18';
  ctx.font = "700 14px 'Space Grotesk', sans-serif";
  ctx.fillText('VALOR TOTAL', 28, posTotal);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#c1440e';
  ctx.font = "700 27px 'Space Grotesk', sans-serif";
  ctx.fillText(fmt(current.total), W-28, posTotal + 4);

  const barcodeSource = $('barcodeCanvas');
  if (barcodeSource && barcodeSource.width > 0){
    ctx.drawImage(barcodeSource, 28, posBarcode, W-56, 26);
  }

  return canvas;
}

async function handleShare(){
  // give web fonts a chance to be ready before drawing text on the canvas
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch(e) {}
  }
  const logoEl = $('aogalogo');
  if (logoEl.decode) { try { await logoEl.decode(); } catch(e) {} }
  const canvas = buildShareCanvas();

  canvas.toBlob(async blob => {
    if (!blob){
      $('shareImg').src = canvas.toDataURL('image/png');
      $('shareModal').classList.add('open');
      return;
    }
    const file = new File([blob], 'aogaprint-orcamento.png', {type:'image/png'});
    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      try {
        await navigator.share({files:[file], title:'Orçamento aogaprint'});
        return;
      } catch(e){
        // cancelled or unsupported — fall through to modal
      }
    }
    $('shareImg').src = canvas.toDataURL('image/png');
    $('shareModal').classList.add('open');
  }, 'image/png');
}

$('shareBtn').addEventListener('click', handleShare);

$('shareModalClose').addEventListener('click', () => {
  $('shareModal').classList.remove('open');
});
$('shareModal').addEventListener('click', (e) => {
  if (e.target.id === 'shareModal') $('shareModal').classList.remove('open');
});
</script>
